# Releases, from the version in Medalluin.toc (tools/release.sh). On a push to
# main whose .toc version has no tag yet, it tags it vX.Y.Z (every tag is kept
# for good) and:
#
#   rolling     replaces the "rolling" release with it: always the newest build,
#               marked Latest
#   its line    moves the release of its minor line (0.2, 1.0) onto it: one
#               release per line, holding the line's newest patch; the first
#               version of the next minor or major starts a line of its own,
#               and the one before stays frozen at its last patch
#
# A push that does not change the version releases nothing. tools/commit.sh
# raises the version with each commit (patch for a fix, minor for a feature,
# major when they have matured); push to release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

# set explicitly, so a run step fails when any command in a pipe does
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every tag, for the plan and the notes

      - name: Plan
        id: plan
        run: tools/release.sh plan | tee -a "$GITHUB_OUTPUT"

      - name: Package and notes
        if: steps.plan.outputs.release == 'true'
        run: |
          tools/release.sh package dist
          tools/release.sh notes > notes.md
          tools/release.sh notes line > line.md
          cat notes.md line.md

      - name: Tag
        if: steps.plan.outputs.release == 'true'
        run: |
          git tag "${{ steps.plan.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.plan.outputs.tag }}"

      - name: Line release (the minor line's newest patch)
        if: steps.plan.outputs.release == 'true'
        run: |
          tag="${{ steps.plan.outputs.tag }}"
          line="${{ steps.plan.outputs.line }}"
          # made on this version first, so a failure leaves the old one standing
          gh release create "$tag" dist/*-"$tag".zip \
            --title "Medalluin $line ($tag)" \
            --notes-file line.md \
            --latest=false
          # then off the line's older patches; their tags stay
          old=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E "^v${line//./\\.}\.[0-9]+$" | grep -vxF "$tag" || true)
          for t in $old; do gh release delete "$t" --yes; done

      - name: Rolling release (every version)
        if: steps.plan.outputs.release == 'true'
        run: |
          tag="${{ steps.plan.outputs.tag }}"
          # the rolling release is made again, not edited, so it sorts as the
          # newest and takes Latest; its tag moves to this commit with it
          gh release delete rolling --cleanup-tag --yes || true
          git push origin :refs/tags/rolling || true
          {
            echo "**Rolling release: always the newest Medalluin, now $tag.**"
            echo "Each minor and major version also has a release of its own below."
            echo
            cat notes.md
          } > rolling.md
          gh release create rolling dist/*-"$tag".zip \
            --target "$GITHUB_SHA" \
            --title "Medalluin $tag (rolling)" \
            --notes-file rolling.md \
            --latest
