# Releases, from the version in Medalluin.toc (tools/release.sh). On a push to
# main with a new .toc version, only vMAJOR.MINOR and rolling tags exist:
#
#   rolling     the active minor line's only release: always the newest build,
#               marked Latest (the active line's vMAJOR.MINOR git tag moves
#               with it, without a duplicate release of its own)
#   frozen      when X or Y increases, the previous minor line's vMAJOR.MINOR
#               tag is frozen into a permanent release (v0.1, v0.2, ...) at
#               that line's last patch
#
# A push that does not change the version releases nothing. tools/commit.sh
# raises the version with each commit (patch for a fix, minor for a feature,
# major when they have matured); push to release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# one release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

# set explicitly, so a run step fails when any command in a pipe does
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every tag, for the plan and the notes

      - name: Plan
        id: plan
        run: tools/release.sh plan | tee -a "$GITHUB_OUTPUT"

      - name: Package and notes
        if: steps.plan.outputs.release == 'true'
        run: |
          tools/release.sh tags HEAD
          tools/release.sh package dist
          tools/release.sh notes > notes.md
          cat notes.md

      - name: Tags and frozen line releases (vMAJOR.MINOR)
        if: steps.plan.outputs.release == 'true'
        run: |
          tag="${{ steps.plan.outputs.tag }}"
          for t in $(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+$'); do
            git push -f origin "refs/tags/$t"
          done
          # remove any legacy 3-part vX.Y.Z releases and tags, and any duplicate release on the active line's tag
          old_rel=$(gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          for t in $old_rel; do gh release delete "$t" --cleanup-tag --yes || true; done
          for t in $(git ls-remote --tags origin 'refs/tags/v*.*.*' | awk '{sub("refs/tags/","",$2); print $2}' | grep -v '\^{}$' || true); do
            git push origin ":refs/tags/$t" || true
          done
          gh release delete "$tag" --yes || true
          # freeze any earlier minor line (vX.Y != current tag) that has no release yet
          for t in $(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V); do
            [ "$t" = "$tag" ] && continue
            if ! gh release view "$t" >/dev/null 2>&1; then
              t_ver="v$(tools/release.sh version "$t")"
              rm -rf dist-freeze
              tools/release.sh package dist-freeze "$t"
              tools/release.sh notes "$t" > freeze.md
              gh release create "$t" dist-freeze/*-"$t_ver".zip \
                --target "$t" \
                --title "Medalluin $t ($t_ver)" \
                --notes-file freeze.md \
                --latest=false
            fi
          done

      - name: Rolling release (every version)
        if: steps.plan.outputs.release == 'true'
        run: |
          ver="v${{ steps.plan.outputs.version }}"
          # the rolling release is made again, not edited, so it sorts as the
          # newest and takes Latest; its tag moves to this commit with it
          gh release delete rolling --cleanup-tag --yes || true
          git push origin :refs/tags/rolling || true
          {
            echo "**Rolling release: always the newest Medalluin, now $ver.**"
            echo "Each earlier minor and major line has a frozen release of its own below."
            echo
            cat notes.md
          } > rolling.md
          gh release create rolling dist/*-"$ver".zip \
            --target "$GITHUB_SHA" \
            --title "Medalluin $ver (rolling)" \
            --notes-file rolling.md \
            --latest
